spring:
  application:
    name: digital-marketing-agency-backend
  data:
    web:
      pageable:
        max-page-size: 100
    mongodb:
      host: localhost
      port: 27017
      database: digital_marketing_agency

server:
  port: 8080

app:
  jwt:
    secret: mysecretkeymysecretkeymysecretkey123456
    expiration: 900000
    refresh-expiration: 604800000

cors:
  allowed-origins:
    - http://localhost:5173

owner:
  email: ${OWNER_EMAIL:owner@agency.com}
  initial-password: ${OWNER_INITIAL_PASSWORD:Admin@12345}
  phone-number: ${OWNER_PHONE_NUMBER:9999999999}
