spring:
  application:
    name: digital-marketing-agency-backend
  data:
    web:
      pageable:
        max-page-size: 100
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      auto-index-creation: false
      transaction:
        enabled: ${SPRING_DATA_MONGODB_TRANSACTION_ENABLED:true}
      
  lifecycle:
    timeout-per-shutdown-phase: 30s


server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: 10

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  rate-limit:
    # In-memory Bucket4j filter limits auth endpoints to 5 requests/minute per IP per instance.
    # For multi-instance clusters, ensure ingress/gateway rate limiting (Nginx/WAF) is active.
    capacity: 5
    refill-tokens: 5
    refill-duration-minutes: 1

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

owner:
  email: ${OWNER_EMAIL}
  initial-password: ${OWNER_INITIAL_PASSWORD}
  phone-number: ${OWNER_PHONE_NUMBER:9999999999}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true
