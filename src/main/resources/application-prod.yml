spring:
  application:
    name: digital-marketing-agency-backend
  data:
    web:
      pageable:
        max-page-size: 100
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}&maxPoolSize=50&minPoolSize=5&connectTimeoutMS=10000&socketTimeoutMS=10000
      auto-index-creation: true
      
  lifecycle:
    timeout-per-shutdown-phase: 30s


server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

owner:
  email: ${OWNER_EMAIL}
  initial-password: ${OWNER_INITIAL_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true
