spring:
  application:
    name: digital-marketing-agency-backend
  data:
    web:
      pageable:
        max-page-size: 100
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      auto-index-creation: true
      transaction:
        enabled: ${SPRING_DATA_MONGODB_TRANSACTION_ENABLED:true}
      
  lifecycle:
    timeout-per-shutdown-phase: 30s


server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

owner:
  email: ${OWNER_EMAIL}
  initial-password: ${OWNER_INITIAL_PASSWORD}
  phone-number: ${OWNER_PHONE_NUMBER:9999999999}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true
