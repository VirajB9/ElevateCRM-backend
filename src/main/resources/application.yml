spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      auto-index-creation: true
      transaction:
        enabled: ${SPRING_DATA_MONGODB_TRANSACTION_ENABLED:false}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
  pageable-as-query-param: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    info:
      enabled: true
